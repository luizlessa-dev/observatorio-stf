# CI da aplicação (typecheck/lint/test/build), adicionada na revisão de
# 2026-09-13 — até então só existiam workflows de ingestão de dados
# (.github/workflows/ingestao-*.yml), e os 91+ testes do projeto rodavam só
# localmente, sem check público no GitHub protegendo os PRs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, lint e testes não tocam rede nem Supabase — cobrem a maior
  # parte da superfície de regressão (inclusive os 100+ testes comportamentais
  # de node --test) sem depender de nenhum segredo.
  #
  # node-version fixado em "22.22.3" (não "22" solto, e não 20):
  #
  # - a primeira execução deste workflow (rodada anterior desta revisão)
  #   falhou em `npm run typecheck` com Node 20 — o Astro 7 instalado exige
  #   Node >=22 em runtime ("Node.js v20.20.2 is not supported by Astro!").
  # - uma instalação limpa em Node 22.13.0 disparou EBADENGINE: o
  #   package-lock.json trava astro@7.2.4 -> unifont@0.7.5 ->
  #   undici@8.10.0, que exige Node >=22.19.0. Em runners Linux x64 (como
  #   ubuntu-latest, usado aqui) o optionalDependency
  #   @napi-rs/lzma-linux-x64-gnu@1.5.1 exige ainda mais: `^22.20 || ^24.12
  #   || >=25` — ou seja, >=22.20.0 na linha 22.x. Essa é a exigência real
  #   mais alta no lockfile inteiro (conferida programaticamente).
  # - "22.22.3" satisfaz as duas acima com folga e é a mesma versão já
  #   usada para validar localmente typecheck/lint/test/build nesta
  #   revisão (`node --version` no ambiente de desenvolvimento). Fixar a
  #   versão exata (em vez de só "22", que resolve para o último patch da
  #   major no momento do job) torna o CI reproduzível e evita depender de
  #   um patch futuro continuar satisfazendo os mesmos lockfile constraints.
  #   package.json#engines reflete o mesmo mínimo real (>=22.20.0).
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: "npm"

      - name: Instalar dependências (modo reprodutível)
        run: npm ci

      - name: Typecheck (astro check + tsc)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes (node --test)
        run: npm test

  # O build estático busca dados reais do Supabase em build-time (páginas
  # como repercussao-geral.astro e ministros/*.astro fazem `await
  # supabase.from(...)` na própria frontmatter; scripts/gerar-og-images.mjs
  # também consulta stf_ministros para gerar as imagens de compartilhamento).
  # Não existe hoje um projeto Supabase de preview/staging — só o de
  # produção.
  #
  # Por decisão explícita da revisão de 2026-09-13 (item 5.7: "não chame
  # Stripe ou Supabase de produção"), este job não roda por padrão — a
  # condição abaixo lê uma Variable do repositório (Settings → Secrets and
  # variables → Actions → Variables), não um Secret, porque `if:` não tem
  # acesso ao contexto `secrets`. Para habilitar, o mantenedor precisa de
  # DOIS passos conscientes:
  #   1) criar os Secrets PUBLIC_SUPABASE_URL e PUBLIC_SUPABASE_ANON_KEY —
  #      a chave ANÔNIMA (RLS protege os dados; a mesma chave já fica
  #      pública no HTML/JS de qualquer visitante do site, ver
  #      .env.example) — nunca SUPABASE_SERVICE_ROLE_KEY;
  #   2) criar a Variable CI_BUILD_SUPABASE com valor "true".
  # Sem os dois, este job é pulado (não falha o PR) e o build continua
  # validado apenas localmente e no preview do Vercel.
  build:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: ${{ vars.CI_BUILD_SUPABASE == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: "npm"

      - name: Instalar dependências (modo reprodutível)
        run: npm ci

      - name: Build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      # AUD-09: a CSP em vercel.json foi para enforcement real, com
      # script-src travado em hashes sha256 dos scripts inline (computados à
      # mão, não gerados a cada build — ver scripts/verificar-csp-hashes.mjs).
      # Esse hardcode é frágil a qualquer mudança nesses scripts (upgrade do
      # Astro, edição em Base.astro): sem este check, um hash desatualizado
      # quebraria o menu mobile ou a hidratação de uma ilha em produção,
      # silenciosamente — só apareceria como bloqueio no console do
      # visitante. Só roda aqui porque só aqui o dist/ real existe.
      - name: Verificar hashes da CSP contra o build real
        run: node scripts/verificar-csp-hashes.mjs
