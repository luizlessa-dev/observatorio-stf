name: Ingestão Diária — STF

on:
  schedule:
    - cron: "0 8 * * *"   # todo dia às 08h UTC (05h BRT)
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano a ingerir (default: ano atual)"
        required: false
        default: ""

jobs:
  votacoes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # necessário para Workload Identity Federation (GCP)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install supabase google-cloud-bigquery

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Fetch votações (BigQuery — Corte Aberta)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GCP_PROJECT: brinsider-dou
        run: |
          ANO="${{ github.event.inputs.ano }}"
          if [ -z "$ANO" ]; then
            ANO=$(date +%Y)
          fi
          python ingestao/stf/fetch_votacoes_bigquery.py --ano "$ANO"

      # Fase C1 (2026-07-26): etapa de cálculo de scores DESABILITADA.
      # A heurística de scores ideológicos está suspensa por falta de
      # sustentação metodológica (ver docs/auditoria-integridade-dados.md).
      # A etapa fica atrás de uma flag explicitamente desativada para que uma
      # falha ou reativação acidental não contamine a ingestão oficial de
      # votações acima. Só reative mudando ENABLE_SCORES para "true" em uma
      # decisão editorial consciente, com metodologia publicada.
      # Recomendação registrada: mover o cálculo experimental de scores para
      # um workflow separado da ingestão oficial.
      - name: Calcular scores termômetro (suspenso — Fase C1)
        if: ${{ false }}  # ENABLE_SCORES: etapa suspensa; não reativar sem metodologia publicada
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingestao/stf/calc_scores_termometro.py
