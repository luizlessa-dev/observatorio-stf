name: Ingestão Diária — Decisões do STF

# Achado D1 da auditoria de 2026-08-17.
#
# Este workflow SUBSTITUI o papel de ingestao-diaria.yml (BigQuery), cuja fonte
# — basedosdados.br_stf_corte_aberta.decisoes — está estática desde março/2025
# e não tem nada além de 19/01/2025. Aquele workflow permanece no repositório
# com o schedule desligado; não reative os dois ao mesmo tempo.
#
# A fonte aqui é o Qlik Sense do próprio STF (transparencia.stf.jus.br), que
# recarrega diariamente por volta das 09h15 UTC. O cron roda às 12h UTC para
# pegar o reload do dia com folga.

on:
  # ── SCHEDULE RELIGADO em 2026-08-19, agora em runner self-hosted ──
  # O WAF do STF devolve 403 para os runners hospedados do GitHub — confirmado
  # em três execuções, a última com o conjunto completo de cabeçalhos de
  # navegador. Os mesmos cabeçalhos e o mesmo código passam de rede
  # residencial, então o bloqueio é por origem de rede.
  #
  # `runs-on: self-hosted` aponta para o Mac do Luiz (runner "mac-luiz"). Isso
  # também é o teste decisivo do diagnóstico: se passar aqui, era mesmo IP de
  # datacenter e não diferença de stack TLS.
  #
  # LIMITAÇÃO CONHECIDA: só roda com a máquina ligada e acordada. Uma execução
  # perdida não é perda de dado — o upsert é idempotente e a execução seguinte
  # recupera o atraso, porque a ingestão sempre varre o ano inteiro.
  schedule:
    - cron: "0 12 * * *"   # 12h UTC (09h BRT), ~3h após o reload do Qlik
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano a ingerir (vazio = ano atual)"
        required: false
        default: ""
      escrever:
        description: "Gravar no Supabase (desmarcado = dry-run)"
        required: true
        default: false
        type: boolean

concurrency:
  group: ingestao-stf-decisoes
  cancel-in-progress: false

jobs:
  decisoes:
    # Ver o comentário em `on:` — runner hospedado recebe 403 do STF.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: python3 -m pip install --user --quiet --upgrade supabase websockets certifi

      - name: Testes do conector
        # Estáticos e sem rede. Falham se a lista de colunas, a trava de
        # destino ou a guarda de dry-run forem mexidas sem intenção.
        run: python3 -m unittest discover -s ingestao/stf/tests

      - name: Ingerir decisões
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +x
          ANO="${{ github.event.inputs.ano }}"
          if [ -z "$ANO" ]; then ANO=$(date +%Y); fi

          # O schedule sempre grava — é o objetivo dele. O disparo manual só
          # grava com a caixa marcada; qualquer outro valor cai em dry-run.
          FLAG="--dry-run"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FLAG="--escrever"
          elif [ "${{ github.event.inputs.escrever }}" = "true" ]; then
            FLAG="--escrever"
          fi

          python3 ingestao/stf/fetch_decisoes_qlik.py --ano "$ANO" $FLAG
